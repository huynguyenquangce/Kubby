# Manual test scenarios for Kubby's Health checks view.
#
# Apply to a disposable cluster only (kind, minikube):
#   kubectl apply -f testdata/manual/health-checks.yaml
# Everything lives in namespaces named kubby-demo-*, and the webhooks match only
# namespaces labelled kubby.dev/health-demo=true, so nothing else is affected.
# Clean-up steps are in src/kubby/docs/health-checks.md ("Manual test").

apiVersion: v1
kind: Namespace
metadata:
  name: kubby-demo-checks
  labels:
    kubby.dev/health-demo: "true"
---
# Scenario 1 — CRITICAL: failurePolicy Fail, backend Service does not exist.
# While it exists, creating a Pod in kubby-demo-checks is rejected.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: kubby-demo-broken-fail
webhooks:
  - name: broken-fail.kubby.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 5
    namespaceSelector:
      matchLabels:
        kubby.dev/health-demo: "true"
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
    clientConfig:
      service:
        namespace: kubby-demo-checks
        name: webhook-that-does-not-exist
---
# Scenario 2 — WARNING: failurePolicy Ignore, Service exists but no Pod backs it,
# and the timeout is longer than the 10s default.
apiVersion: v1
kind: Service
metadata:
  name: idle-webhook
  namespace: kubby-demo-checks
spec:
  selector:
    app: nothing-matches-this
  ports:
    - port: 443
      targetPort: 8443
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: kubby-demo-ignored
webhooks:
  - name: ignored.kubby.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Ignore
    timeoutSeconds: 20
    namespaceSelector:
      matchLabels:
        kubby.dev/health-demo: "true"
    rules:
      - operations: ["CREATE"]
        apiGroups: ["apps"]
        apiVersions: ["v1"]
        resources: ["deployments"]
    clientConfig:
      service:
        namespace: kubby-demo-checks
        name: idle-webhook
---
# Scenario 3 — CRITICAL: a TLS Secret whose certificate expired on 2021-01-02.
apiVersion: v1
kind: Secret
metadata:
  name: expired-tls
  namespace: kubby-demo-checks
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
---
# Scenario 4 — WARNING: an Ingress that uses expired-tls, and one whose TLS
# Secret does not exist at all.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: expired-site
  namespace: kubby-demo-checks
spec:
  tls:
    - hosts: ["expired.kubby.test"]
      secretName: expired-tls
  defaultBackend:
    service:
      name: idle-webhook
      port:
        number: 443
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: missing-secret-site
  namespace: kubby-demo-checks
spec:
  tls:
    - hosts: ["missing.kubby.test"]
      secretName: secret-that-does-not-exist
  defaultBackend:
    service:
      name: idle-webhook
      port:
        number: 443
---
# Scenario 5 — stuck deletion: nothing removes this finalizer. Delete it with
#   kubectl delete configmap held-by-finalizer -n kubby-demo-checks --wait=false
apiVersion: v1
kind: ConfigMap
metadata:
  name: held-by-finalizer
  namespace: kubby-demo-checks
  finalizers:
    - kubby.dev/demo-hold
data:
  note: "Stuck Terminating once deleted"
---
# Scenario 6 — stuck namespace: its content is held by a finalizer. Delete it with
#   kubectl delete namespace kubby-demo-stuck-ns --wait=false
apiVersion: v1
kind: Namespace
metadata:
  name: kubby-demo-stuck-ns
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blocks-namespace
  namespace: kubby-demo-stuck-ns
  finalizers:
    - kubby.dev/demo-hold
data:
  note: "Keeps its namespace Terminating"
