apiVersion: v1
kind: Namespace
metadata:
  name: kubby-ci
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.kubby.dev
spec:
  group: kubby.dev
  scope: Namespaced
  names:
    plural: widgets
    singular: widget
    kind: Widget
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: v1
kind: Pod
metadata:
  name: ci-pod
  namespace: kubby-ci
  labels:
    app: kubby-ci
spec:
  containers:
    - name: hold
      image: registry.invalid/kubby-ci/never-pulled:1
      command: ["sh", "-c", "sleep 3600"]
---
apiVersion: v1
kind: Pod
metadata:
  name: ci-client
  namespace: kubby-ci
  labels:
    app: kubby-ci-client
spec:
  containers:
    - name: hold
      image: registry.invalid/kubby-ci/never-pulled:1
      command: ["sh", "-c", "sleep 3600"]
---
# Isolates ci-pod for ingress with no allow rule, so netpol-check from
# ci-client must report BLOCKED. Evaluation reads the API objects only; it does
# not depend on the CNI enforcing the policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ci-deny-ingress
  namespace: kubby-ci
spec:
  podSelector:
    matchLabels:
      app: kubby-ci
  policyTypes: ["Ingress"]
---
# A stand-in ingress-nginx controller: only its labels matter, because the
# Traffic view identifies controller Pods from the IngressClass controller.
apiVersion: v1
kind: Namespace
metadata:
  name: kubby-ci-ingress
---
apiVersion: v1
kind: Pod
metadata:
  name: ci-ingress-controller
  namespace: kubby-ci-ingress
  labels:
    app.kubernetes.io/name: ingress-nginx
    app.kubernetes.io/component: controller
spec:
  containers:
    - name: hold
      image: registry.invalid/kubby-ci/never-pulled:1
      command: ["sh", "-c", "sleep 3600"]
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: ci-nginx
spec:
  controller: k8s.io/ingress-nginx
---
apiVersion: v1
kind: Service
metadata:
  name: ci-web
  namespace: kubby-ci
spec:
  selector:
    app: kubby-ci
  ports:
    - name: web
      port: 80
      targetPort: 8080
---
# Routed through ci-nginx to ci-pod, which ci-deny-ingress isolates with no
# allow rule: netflows must report this route as blocked by that policy.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ci-web
  namespace: kubby-ci
spec:
  ingressClassName: ci-nginx
  rules:
    - host: ci.kubby.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ci-web
                port:
                  number: 80
---
# Health checks. The broken webhook matches only this labelled namespace, where
# nothing is created afterwards, so its missing backend cannot break the smoke.
apiVersion: v1
kind: Namespace
metadata:
  name: kubby-ci-webhook
  labels:
    kubby.dev/webhook-test: "true"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: ci-broken-webhook
webhooks:
  - name: broken.kubby.dev
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    namespaceSelector:
      matchLabels:
        kubby.dev/webhook-test: "true"
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]
    clientConfig:
      service:
        namespace: kubby-ci-webhook
        name: missing-webhook
---
# Self-signed test certificate that expired on 2021-01-02; the key is test-only.
apiVersion: v1
kind: Secret
metadata:
  name: ci-expired-tls
  namespace: kubby-ci
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
---
# Held by a finalizer nothing removes; the smoke deletes it to observe a stuck
# deletion in the Health checks report.
apiVersion: v1
kind: ConfigMap
metadata:
  name: ci-stuck
  namespace: kubby-ci
  finalizers:
    - kubby.dev/ci-hold
data:
  purpose: stuck-deletion fixture
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ci-pdb
  namespace: kubby-ci
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: kubby-ci
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ci-hpa
  namespace: kubby-ci
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ci-missing
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
