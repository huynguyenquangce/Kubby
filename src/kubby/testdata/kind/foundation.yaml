apiVersion: v1
kind: Namespace
metadata:
  name: kubby-ci
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.kubby.dev
spec:
  group: kubby.dev
  scope: Namespaced
  names:
    plural: widgets
    singular: widget
    kind: Widget
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
---
apiVersion: v1
kind: Pod
metadata:
  name: ci-pod
  namespace: kubby-ci
  labels:
    app: kubby-ci
spec:
  containers:
    - name: hold
      image: registry.invalid/kubby-ci/never-pulled:1
      command: ["sh", "-c", "sleep 3600"]
