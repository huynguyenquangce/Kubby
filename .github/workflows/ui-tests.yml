name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/kubby
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: src/kubby/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/kubby/frontend/package-lock.json
      - name: Build embedded frontend
        working-directory: src/kubby/frontend
        run: |
          npm ci
          npm run build
      - name: Check formatting
        shell: bash
        run: |
          files="$(gofmt -l *.go internal/k8sclient/*.go internal/buildinfo/*.go cmd/kubby-cli/*.go)"
          if [ -n "$files" ]; then
            echo "The following Go files need gofmt:"
            echo "$files"
            exit 1
          fi
      - name: Run backend tests
        run: go test ./...
      - name: Build backend and CLI
        run: go build ./...
      - name: Run Go vet
        run: go vet ./...

  playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/kubby/frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/kubby/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run frontend unit tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Run browser UI tests
        run: npm run test:e2e
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            src/kubby/frontend/playwright-report/
            src/kubby/frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  kind-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/kubby
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: src/kubby/go.sum
      - name: Install pinned kind
        shell: bash
        env:
          GOBIN: ${{ runner.temp }}/kind-bin
        run: |
          mkdir -p "$GOBIN"
          go install sigs.k8s.io/kind@v0.32.0
          echo "$GOBIN" >> "$GITHUB_PATH"
      - name: Run real-cluster smoke
        run: ./scripts/verify-kind.sh

  windows-build:
    needs: [backend, playwright, kind-integration]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/kubby
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache-dependency-path: src/kubby/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/kubby/frontend/package-lock.json
      - name: Build complete Windows application
        run: go run github.com/wailsapp/wails/v2/cmd/wails@v2.13.0 build -platform windows/amd64 -trimpath
      - name: Reject stale generated bindings
        run: git -c core.fileMode=false diff --exit-code -- frontend/wailsjs/go/main
      - name: Verify and checksum Windows artifact
        shell: bash
        run: |
          file build/bin/kubby.exe | grep -Eq 'PE32\+.*x86-64'
          sha256sum build/bin/kubby.exe > build/bin/kubby.exe.sha256
          sha256sum -c build/bin/kubby.exe.sha256
      - name: Upload CI Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: kubby-windows-amd64-ci-${{ github.sha }}
          path: |
            src/kubby/build/bin/kubby.exe
            src/kubby/build/bin/kubby.exe.sha256
          if-no-files-found: error
          retention-days: 7
