name: UI tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/kubby/frontend
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/kubby/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run frontend unit tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Run browser UI tests
        run: npm run test:e2e
      - name: Upload Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            src/kubby/frontend/playwright-report/
            src/kubby/frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
